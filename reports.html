<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan - FinBot</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="css/tailwind.config.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors">
  <!-- Sidebar Container -->
  <div id="sidebar-container"></div>
  
  <!-- Main Content Area -->
  <div class="lg:pl-64">
    <!-- Topbar Container -->
    <div id="topbar-container"></div>
    
    <!-- Page Content -->
    <main id="page-content" class="p-4 sm:p-6 lg:p-8">
      <div class="max-w-7xl mx-auto">
        <!-- Date Filters -->
        <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
          <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
            <div class="flex items-center gap-2">
              <i class="fas fa-calendar-alt text-gray-500 dark:text-gray-400"></i>
              <select id="report-period" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white">
                <option value="month">Bulan Ini</option>
                <option value="today">Hari Ini</option>
                <option value="week">7 Hari Terakhir</option>
                <option value="year">Tahun Ini</option>
                <option value="all">Semua Waktu</option>
                <option value="custom">Kustom</option>
              </select>
            </div>
            <div class="flex gap-2">
              <input 
                type="date" 
                id="start-date"
                class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white"
              />
              <span class="text-gray-500 dark:text-gray-400 self-center">-</span>
              <input 
                type="date" 
                id="end-date"
                class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white"
              />
            </div>
          </div>
        </div>
        
        <!-- Report Summary -->
        <div id="report-summary" class="mb-6"></div>
        
        <!-- Charts and Breakdown -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Trend Chart -->
          <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">Tren Harian</h3>
            <div class="h-64">
              <canvas id="trendChart"></canvas>
            </div>
          </div>
          
          <!-- Category Breakdown -->
          <div id="category-breakdown" class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
            <!-- Will be rendered here -->
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- Scripts -->
  <script src="js/core/storage.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/topbar.js"></script>
  <script src="js/components/charts.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

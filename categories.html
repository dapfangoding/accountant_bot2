<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategori - FinBot</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="css/tailwind.config.js"></script>
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors">
  <!-- Sidebar Container -->
  <div id="sidebar-container"></div>
  
  <!-- Main Content Area -->
  <div class="lg:pl-64">
    <!-- Topbar Container -->
    <div id="topbar-container"></div>
    
    <!-- Page Content -->
    <main id="page-content" class="p-4 sm:p-6 lg:p-8">
      <div class="max-w-6xl mx-auto">
        <!-- Add Category Form -->
        <div id="add-category-form" class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
          <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-4 flex items-center gap-2">
            <i class="fas fa-plus-circle text-primary-500"></i>
            Tambah Kategori Baru
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <input 
              type="text" 
              id="category-name"
              placeholder="Nama kategori" 
              class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white"
            />
            <select id="category-type" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white">
              <option value="expense">Pengeluaran</option>
              <option value="income">Pemasukan</option>
            </select>
            <input 
              type="color" 
              id="category-color"
              value="#6b7280"
              class="px-2 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white dark:bg-gray-700 h-10 w-full cursor-pointer"
            />
            <select id="category-icon" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white">
              <option value="fa-folder">📁 Folder</option>
              <option value="fa-utensils">🍽️ Makanan</option>
              <option value="fa-car">🚗 Transport</option>
              <option value="fa-shopping-bag">🛒 Belanja</option>
              <option value="fa-film">🎬 Hiburan</option>
              <option value="fa-money-bill">💰 Uang</option>
              <option value="fa-gift">🎁 Hadiah</option>
              <option value="fa-home">🏠 Rumah</option>
              <option value="fa-heart">❤️ Kesehatan</option>
              <option value="fa-graduation-cap">🎓 Pendidikan</option>
            </select>
            <div class="flex gap-2">
              <button id="add-category-btn" class="flex-1 px-4 py-2 bg-primary-500 hover:bg-primary-600 text-white rounded-lg transition-colors">
                <i class="fas fa-plus"></i> Tambah
              </button>
              <button id="save-category-btn" class="hidden flex-1 px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg transition-colors">
                <i class="fas fa-check"></i> Simpan
              </button>
            </div>
          </div>
        </div>
        
        <!-- Categories List -->
        <div id="categories-list">
          <!-- Categories will be rendered here -->
        </div>
      </div>
    </main>
  </div>
  
  <!-- Scripts -->
  <script src="js/core/storage.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/topbar.js"></script>
  <script src="js/pages/categories.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinBot AI - Daftar Transaksi</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface": "#0b1326",
            "surface-dim": "#0b1326",
            "surface-bright": "#31394d",
            "surface-container-lowest": "#060e20",
            "surface-container-low": "#131b2e",
            "surface-container": "#171f33",
            "surface-container-high": "#222a3d",
            "surface-container-highest": "#2d3449",
            "on-surface": "#dae2fd",
            "on-surface-variant": "#bbcabf",
            "inverse-surface": "#dae2fd",
            "inverse-on-surface": "#283044",
            "outline": "#86948a",
            "outline-variant": "#3c4a42",
            "surface-tint": "#4edea3",
            "primary": "#4edea3",
            "on-primary": "#003824",
            "primary-container": "#10b981",
            "on-primary-container": "#00422b",
            "inverse-primary": "#006c49",
            "secondary": "#95d3ba",
            "on-secondary": "#003829",
            "secondary-container": "#0b513d",
            "on-secondary-container": "#83c2a9",
            "tertiary": "#45dfa4",
            "on-tertiary": "#003825",
            "tertiary-container": "#00b982",
            "on-tertiary-container": "#00422c",
            "error": "#ffb4ab",
            "on-error": "#690005",
            "error-container": "#93000a",
            "on-error-container": "#ffdad6",
            "primary-fixed": "#6ffbbe",
            "primary-fixed-dim": "#4edea3",
            "on-primary-fixed": "#002113",
            "on-primary-fixed-variant": "#005236",
            "secondary-fixed": "#b0f0d6",
            "secondary-fixed-dim": "#95d3ba",
            "on-secondary-fixed": "#002117",
            "on-secondary-fixed-variant": "#0b513d",
            "tertiary-fixed": "#68fcbf",
            "tertiary-fixed-dim": "#45dfa4",
            "on-tertiary-fixed": "#002114",
            "on-tertiary-fixed-variant": "#005137",
            "background": "#0b1326",
            "on-background": "#dae2fd"
          },
          "borderRadius": {
            "sm": "0.25rem",
            "DEFAULT": "0.5rem",
            "md": "0.75rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          "spacing": {
            "gutter-sm": "0.75rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "0.75rem",
            "space-lg": "1rem",
            "space-xl": "1.5rem",
            "space-2xl": "2rem",
            "gutter": "1rem",
            "margin": "1rem",
            "margin-lg": "1.5rem"
          },
          "fontFamily": {
            "jakarta": ["Plus Jakarta Sans", "system-ui", "sans-serif"]
          },
          "fontSize": {
            "headline-sm": ["18px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }],
            "headline-md": ["22px", { "lineHeight": "30px", "letterSpacing": "-0.015em", "fontWeight": "600" }],
            "label-caps": ["10px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "700" }],
            "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.005em", "fontWeight": "400" }],
            "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
            "display-currency": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
            "display-currency-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "body-md": ["14px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      display: inline-block;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    * { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen pb-28">
  <!-- Sidebar Container -->
  <div id="sidebar-container"></div>
  
  <!-- Main Content Area -->
  <div class="lg:pl-64">
    <!-- Topbar Container -->
    <div id="topbar-container"></div>
    
    <!-- Main Content -->
    <main class="w-full max-w-4xl mx-auto px-4 pt-20 flex flex-col gap-5 pb-32 lg:pb-8">
      <!-- Search Input -->
      <div class="relative flex items-center bg-surface-container-low rounded-lg border border-outline-variant/30 focus-within:border-primary transition-all">
        <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px]" data-icon="search">search</span>
        <input id="search-input" class="w-full bg-transparent pl-11 pr-10 py-3 text-on-surface text-body-md placeholder:text-on-surface-variant/60 focus:outline-none border-0" placeholder="Cari transaksi, toko, atau keterangan..." type="text">
        <button class="absolute right-3 p-1 rounded text-on-surface-variant hover:text-on-surface transition-colors">
          <span class="material-symbols-outlined text-[20px]" data-icon="receipt">receipt</span>
        </button>
      </div>

      <!-- Filter Chips -->
      <div class="overflow-x-auto no-scrollbar flex items-center gap-2 -mx-4 px-4 py-1">
        <button id="filter-all" class="px-3.5 py-1.5 rounded-full bg-primary-container text-on-primary-container font-label-md shadow-sm font-semibold active:scale-95 transition-all">Semua</button>
        <button id="filter-expense" class="px-3.5 py-1.5 rounded-full bg-surface-container-low border border-outline-variant/30 hover:border-outline text-on-surface-variant hover:text-on-surface font-label-md active:scale-95 flex items-center gap-1 transition-all">
          <span class="w-2 h-2 rounded-full bg-error"></span>
          Pengeluaran
        </button>
        <button id="filter-income" class="px-3.5 py-1.5 rounded-full bg-surface-container-low border border-outline-variant/30 hover:border-outline text-on-surface-variant hover:text-on-surface font-label-md active:scale-95 flex items-center gap-1 transition-all">
          <span class="w-2 h-2 rounded-full bg-primary"></span>
          Pemasukan
        </button>
        <button class="px-3.5 py-1.5 rounded-full bg-secondary-container/40 border border-secondary-container text-secondary font-label-md active:scale-95 flex items-center gap-1 transition-all">
          <span class="material-symbols-outlined text-[16px]" data-icon="calendar_month">calendar_month</span>
          Bulan Ini
        </button>
      </div>

      <!-- Monthly Summary -->
      <div class="bg-surface-container-low rounded-lg p-4 border border-outline-variant/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3 relative overflow-hidden shadow-sm">
        <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-primary/5 rounded-full blur-2xl pointer-events-none"></div>
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 rounded-lg bg-primary-container/20 border border-primary/25 flex items-center justify-center text-primary">
            <span class="material-symbols-outlined text-[22px]" data-icon="query_stats">query_stats</span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <p class="text-label-caps text-on-surface-variant">Ringkasan Bulan Ini</p>
              <span class="px-2 py-0.5 rounded-full bg-secondary-container/60 text-secondary text-label-caps" id="transaction-count">47 Transaksi</span>
            </div>
            <div class="flex items-baseline gap-2 mt-1">
              <span class="text-headline-sm font-bold text-primary" id="month-balance">+Rp 2.425.000</span>
              <span class="text-body-sm text-on-surface-variant">Net Balance</span>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-3 pt-2 sm:pt-0 border-t sm:border-t-0 border-outline-variant/20">
          <div class="flex flex-col text-right">
            <span class="text-label-caps text-on-surface-variant" id="month-income">IN: +Rp 6.200k</span>
            <span class="text-label-caps text-error" id="month-expense">OUT: -Rp 3.775k</span>
          </div>
          <button class="w-8 h-8 rounded bg-surface-container-high hover:bg-surface-bright flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors">
            <span class="material-symbols-outlined text-[18px]" data-icon="chevron_right">chevron_right</span>
          </button>
        </div>
      </div>

      <!-- Transactions List -->
      <div id="transactions-container" class="space-y-6">
        <!-- Transactions grouped by date will be rendered here -->
      </div>

      <!-- Load More / Empty State -->
      <div id="transactions-empty" class="hidden rounded-lg bg-surface-container-low border border-outline-variant/30 p-8 text-center">
        <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mx-auto mb-4 border border-outline-variant/20">
          <span class="material-symbols-outlined text-primary text-[28px]" data-icon="receipt_long">receipt_long</span>
        </div>
        <h3 class="text-headline-sm font-bold text-on-surface mb-2">Belum ada transaksi</h3>
        <p class="text-body-md text-on-surface-variant mb-6">Mulai tambahkan transaksi pertama Anda dengan klik tombol di bawah.</p>
        <button class="px-4 py-2.5 rounded-lg bg-primary-container text-on-primary-container hover:bg-primary font-label-lg active:scale-95 shadow-sm flex items-center gap-2 mx-auto" onclick="Router.navigate('chatbot')">
          <span class="material-symbols-outlined text-base font-bold" data-icon="add_circle">add_circle</span>
          <span>Tambah via Chat AI</span>
        </button>
      </div>

      <!-- Pagination -->
      <div id="pagination" class="flex items-center justify-center gap-2 pt-4">
        <!-- Pagination rendered by JS -->
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/core/storage.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/topbar.js"></script>
  <script src="js/pages/transactions.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Filter button functionality
    document.addEventListener('DOMContentLoaded', function() {
      const filterAll = document.getElementById('filter-all');
      const filterExpense = document.getElementById('filter-expense');
      const filterIncome = document.getElementById('filter-income');

      filterAll.addEventListener('click', function() {
        filterAll.classList.remove('bg-surface-container-low', 'border', 'text-on-surface-variant');
        filterAll.classList.add('bg-primary-container', 'text-on-primary-container');
        filterExpense.classList.remove('bg-primary-container', 'text-on-primary-container');
        filterExpense.classList.add('bg-surface-container-low', 'border', 'text-on-surface-variant');
        filterIncome.classList.remove('bg-primary-container', 'text-on-primary-container');
        filterIncome.classList.add('bg-surface-container-low', 'border', 'text-on-surface-variant');
      });

      filterExpense.addEventListener('click', function() {
        filterExpense.classList.remove('bg-surface-container-low', 'border', 'text-on-surface-variant');
        filterExpense.classList.add('bg-primary-container', 'text-on-primary-container');
        filterAll.classList.remove('bg-primary-container', 'text-on-primary-container');
        filterAll.classList.add('bg-surface-container-low', 'border', 'text-on-surface-variant');
        filterIncome.classList.remove('bg-primary-container', 'text-on-primary-container');
        filterIncome.classList.add('bg-surface-container-low', 'border', 'text-on-surface-variant');
      });

      filterIncome.addEventListener('click', function() {
        filterIncome.classList.remove('bg-surface-container-low', 'border', 'text-on-surface-variant');
        filterIncome.classList.add('bg-primary-container', 'text-on-primary-container');
        filterAll.classList.remove('bg-primary-container', 'text-on-primary-container');
        filterAll.classList.add('bg-surface-container-low', 'border', 'text-on-surface-variant');
        filterExpense.classList.remove('bg-primary-container', 'text-on-primary-container');
        filterExpense.classList.add('bg-surface-container-low', 'border', 'text-on-surface-variant');
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot - FinBot</title>
  
  <script>
    try {
      const s = localStorage.getItem('finance_settings');
      if (s && JSON.parse(s).darkMode) {
        document.documentElement.classList.add('dark');
      }
    } catch(e) {}
  </script>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="css/tailwind.config.js"></script>
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
  
  <style>
    #chat-messages {
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .message-wrapper {
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-surface dark:bg-gray-900 transition-colors">
  <!-- Sidebar Container -->
  <div id="sidebar-container"></div>
  
  <!-- Main Content Area -->
  <div class="lg:pl-64">
    <!-- Topbar Container -->
    <div id="topbar-container"></div>
    
      <!-- Chat Container -->
    <main class="flex-1 flex flex-col h-[calc(100vh-128px)] bg-background dark:bg-gray-900">
      <!-- Quick Action Chips -->
      <div class="sticky top-[64px] z-20 bg-surface/75 dark:bg-surface-container/75 backdrop-blur-md border-b border-outline-variant/15 dark:border-outline/20 py-2 px-4">
        <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar">
          <button onclick="quickCommand('analisis')" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 hover:bg-primary hover:text-white transition-all whitespace-nowrap shadow-sm">
            <i class="fas fa-chart-pie text-sm text-primary dark:text-emerald-400"></i> Analisis
          </button>
          <button onclick="quickCommand('laporan')" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 hover:bg-primary hover:text-white transition-all whitespace-nowrap shadow-sm">
            <i class="fas fa-file-alt text-sm text-primary dark:text-emerald-400"></i> Laporan
          </button>
          <button onclick="quickCommand('saldo')" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 hover:bg-primary hover:text-white transition-all whitespace-nowrap shadow-sm">
            <i class="fas fa-wallet text-sm text-primary dark:text-emerald-400"></i> Saldo
          </button>
          <button onclick="quickCommand('bantuan')" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 hover:bg-primary hover:text-white transition-all whitespace-nowrap shadow-sm">
            <i class="fas fa-question-circle text-sm text-primary dark:text-emerald-400"></i> Bantuan
          </button>
        </div>
      </div>

      <!-- Messages Area -->
      <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 pb-40">
        <!-- Messages rendered here -->
      </div>

      <!-- Floating Input Bar -->
      <div class="fixed bottom-0 left-0 right-0 z-40 px-4 py-3 pointer-events-none lg:pl-64">
        <div class="max-w-full pointer-events-auto">
          <div class="p-1.5 rounded-full bg-surface-container-lowest/90 dark:bg-gray-800/90 backdrop-blur-2xl border border-outline-variant/30 dark:border-outline/20 shadow-xl flex items-center gap-2">
            <!-- Attachment button -->
            <button aria-label="Lampirkan file" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors active:scale-95">
              <i class="fas fa-paperclip text-lg"></i>
            </button>
            
            <!-- Input field -->
            <div class="flex-1 relative flex items-center">
              <input 
                id="chat-input" 
                type="text" 
                placeholder="Tanya FinBot atau ketik perintah..." 
                class="w-full bg-transparent border-0 text-on-surface placeholder:text-outline text-sm focus:ring-0 px-2 py-2 outline-none"
              />
            </div>
            
            <!-- Voice button -->
            <button aria-label="Kirim pesan suara" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors active:scale-95">
              <i class="fas fa-microphone text-lg"></i>
            </button>
            
            <!-- Send button -->
            <button 
              id="send-btn"
              aria-label="Kirim pesan" 
              class="w-11 h-11 rounded-full bg-primary hover:bg-primary-container text-on-primary flex items-center justify-center shadow-md active:scale-95 transition-all duration-150"
            >
              <i class="fas fa-arrow-up text-lg"></i>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- Scripts -->
  <script src="js/core/storage.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/topbar.js"></script>
  <script src="js/pages/chatbot.js"></script>
  <script src="js/app.js"></script>

  <script>
    function quickCommand(cmd) {
      const input = document.getElementById('chat-input');
      if (cmd === 'analisis') input.value = 'tampilkan analisis pengeluaran';
      else if (cmd === 'laporan') input.value = 'laporan bulan ini';
      else if (cmd === 'saldo') input.value = 'berapa saldo saya';
      else if (cmd === 'bantuan') input.value = 'help';
      input.focus();
    }
  </script>
</body>
</html>
